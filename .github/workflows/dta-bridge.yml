name: dta-bridge

# DTA/VotexProb köprü zincirinin push sonrası otomatik doğrulaması:
#   1. dta:sync-check            → ÜÇ kopya (repo + surface-z + kurulum)
#                                  tam denetim — self-hosted makinede
#                                  hepsi mevcut, --allow-missing gerekmez.
#   2. ci:prep                   → tüm Rust paketlerinin test kodu derleme
#                                  denetimi (workspace zorunlu).
#   3. cargo test dta            → köprü Rust birim testleri.
#   4. npm test:js               → UI testleri.
# Runner: self-hosted Windows (votex-local) — GitHub-hosted faturalandırmadan
# bağımsız; node/python/cargo makinede kurulu, target/ artımlı derlenir.

on:
  push:
    branches: ["**"]
    paths:
      - "Derin_Tarama_Asistan/**"
      - "src-tauri/src/dta_bridge.rs"
      - "src-tauri/src/dta_chat.rs"
      - "votex-prob/**"
      - "scripts/dta_sync_check.py"
      - "scripts/e2e_dta_bridge.py"
      - "scripts/dta_update.py"
      - ".github/workflows/dta-bridge.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  bridge:
    name: DTA köprü zinciri
    runs-on: votex-local
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Runner araç yolları (cargo — self-hosted makineye özel)
        # cargo kullanıcı profilinde kurulu (~/.cargo) ve servisin env
        # anlık görüntüsüne girmemiş olabilir. GITHUB_PATH/GITHUB_ENV
        # runner-native mekanizması bu adımı deterministik yapar;
        # CARGO_HOME aynı zamanda ci:prep'in resolveCargo fallback'idir.
        run: |
          echo "C:\\Users\\cpbar\\.cargo\\bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=C:\\Users\\cpbar\\.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=C:\\Users\\cpbar\\.rustup" >> "$GITHUB_ENV"

      - name: Bağımlılıklar (kalıcı node_modules)
        run: npm install --no-audit --no-fund

      - name: Rust test derleme denetimi (tüm paketler)
        # cargo test dta yalnızca adı geçen testleri derler; votex-prob ve
        # standalone crate'ler atlanır. Bu adım her paketin test profilini
        # --no-run ile uçtan uca derler: derlenmeyen test kodu (ör. eksik
        # trait import'u) burada yakalanır, yeşil CI'ın ardına saklanamaz.
        run: npm run ci:prep

      - name: DTA kopya senkron denetimi (tam — üç kopya)
        # Self-hosted makinede surface-z ve kurulum kopyaları da mevcut;
        # release guard'ının birebir aynısı CI'da da koşar.
        run: npm run dta:sync-check

      - name: Rust köprü testleri (dta_chat + bridge_tests)
        run: cargo test --manifest-path src-tauri/Cargo.toml dta

      - name: UI testleri (vitest)
        run: npm run test:js
