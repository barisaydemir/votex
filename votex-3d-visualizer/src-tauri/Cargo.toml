[package]
name = "votex-3d-visualizer"
version = "0.1.0"
description = "Votex Standalone 3D XYZ & Anomaly Visualizer Engine"
authors = ["Digital Future Tech"]
edition = "2021"

[workspace]


[lib]
name = "votex_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
dirs = "5"

[features]
default = []
