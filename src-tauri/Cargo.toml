[package]
name = "votex"
version = "0.4.2"
description = "Digital Future Tech — manyetik sensör AI analiz modülü"
authors = ["Digital Future Tech"]
edition = "2021"

[lib]
name = "votex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.0.14"
rfd = "0.15"
hmac = "0.13.0"
sha2 = "0.11.0"
calamine = "0.26"

[dev-dependencies]
votex_prob = { path = "../votex-prob" }

[features]
default = []
